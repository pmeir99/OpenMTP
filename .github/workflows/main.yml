name: Build OpenMTP for macOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths-ignore:
      - 'NativeMac/**'
      - '.github/workflows/build-native-macos.yml'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build native app and installer
        run: bash NativeMac/Scripts/package-macos.sh
      - name: Verify bundle and installer
        run: |
          test -d dist/mac/OpenMTP.app
          test -s dist/mac/OpenMTP.app/Contents/Resources/AppIcon.icns
          test -s dist/OpenMTPNative-macOS.dmg
          codesign --verify --deep --strict dist/mac/OpenMTP.app
          hdiutil imageinfo dist/OpenMTPNative-macOS.dmg
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenMTP-macOS
          path: dist/OpenMTPNative-macOS.dmg
          if-no-files-found: error
          retention-days: 30
